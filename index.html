  <body class="bg-brand-light text-brand-black">
    <div id="root"></div>
    <script>
      // Single global scroll listener to update a CSS variable
      // This avoids React state re-renders for parallax effects
      let lastScrollY = 0;
      const updateScroll = () => {
        const scrollY = window.scrollY;
        if (Math.abs(lastScrollY - scrollY) > 0.5) {
          document.documentElement.style.setProperty('--scroll-y', `${scrollY}px`);
          lastScrollY = scrollY;
        }
        requestAnimationFrame(updateScroll);
      };
      updateScroll();
    </script>
